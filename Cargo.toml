[package]
name = "git-sight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
humantime = "2.4"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
